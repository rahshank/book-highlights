name = "book-highlights"
main = "worker/src/index.ts"
compatibility_date = "2026-07-05"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
OWNER_EMAIL = "rahulshankar24@gmail.com"
OPENAI_MODEL = "gpt-4.1-mini"

[[d1_databases]]
binding = "DB"
database_name = "book-highlights"
database_id = "99447e69-e243-48ee-8dd4-2a07a7ce3431"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "SCAN_IMAGES"
bucket_name = "book-highlights-scans"
