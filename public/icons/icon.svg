<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#b45309"/>
  <g transform="translate(256,256)">
    <!-- Open book -->
    <path d="M-120,-60 L-120,80 Q-60,60 0,80 L0,-60 Q-60,-80 -120,-60 Z" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
    <path d="M120,-60 L120,80 Q60,60 0,80 L0,-60 Q60,-80 120,-60 Z" fill="#fffbeb" stroke="#92400e" stroke-width="4"/>
    <!-- Spine -->
    <line x1="0" y1="-60" x2="0" y2="80" stroke="#92400e" stroke-width="3"/>
    <!-- Highlight lines on right page -->
    <rect x="15" y="-35" width="80" height="6" rx="2" fill="#b45309" opacity="0.6"/>
    <rect x="15" y="-20" width="70" height="6" rx="2" fill="#b45309" opacity="0.6"/>
    <rect x="15" y="-5" width="85" height="6" rx="2" fill="#b45309" opacity="0.6"/>
    <!-- Text lines on left page -->
    <rect x="-100" y="-35" width="75" height="4" rx="2" fill="#92400e" opacity="0.3"/>
    <rect x="-100" y="-22" width="65" height="4" rx="2" fill="#92400e" opacity="0.3"/>
    <rect x="-100" y="-9" width="70" height="4" rx="2" fill="#92400e" opacity="0.3"/>
    <rect x="-100" y="4" width="60" height="4" rx="2" fill="#92400e" opacity="0.3"/>
    <!-- Highlighter pen -->
    <g transform="rotate(-30) translate(80,-20)">
      <rect x="0" y="-6" width="60" height="12" rx="2" fill="#f59e0b"/>
      <polygon points="60,-6 75,0 60,6" fill="#92400e"/>
    </g>
  </g>
</svg>
