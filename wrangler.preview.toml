name = "book-highlights-local-preview"
main = "scripts/preview-worker.ts"
compatibility_date = "2026-07-05"
workers_dev = false
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
[vars]
OWNER_EMAIL = "reader@example.test"
RESEND_API_KEY = "local-preview-no-email-sent"
[[d1_databases]]
binding = "DB"
database_name = "book-highlights-preview"
database_id = "local-only"
migrations_dir = "worker/migrations"
[[r2_buckets]]
binding = "SCAN_IMAGES"
bucket_name = "book-highlights-preview"
