<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icons need safe zone (80% center circle) - keep content within 204.8px radius from center -->
  <rect width="512" height="512" fill="#b45309"/>
  <g transform="translate(256,256)">
    <!-- Open book -->
    <path d="M-100,-50 L-100,65 Q-50,48 0,65 L0,-50 Q-50,-68 -100,-50 Z" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
    <path d="M100,-50 L100,65 Q50,48 0,65 L0,-50 Q50,-68 100,-50 Z" fill="#fffbeb" stroke="#92400e" stroke-width="4"/>
    <!-- Spine -->
    <line x1="0" y1="-50" x2="0" y2="65" stroke="#92400e" stroke-width="3"/>
    <!-- Highlight lines on right page -->
    <rect x="12" y="-28" width="65" height="5" rx="2" fill="#b45309" opacity="0.6"/>
    <rect x="12" y="-15" width="55" height="5" rx="2" fill="#b45309" opacity="0.6"/>
    <rect x="12" y="-2" width="60" height="5" rx="2" fill="#b45309" opacity="0.6"/>
    <!-- Text lines on left page -->
    <rect x="-82" y="-28" width="60" height="4" rx="2" fill="#92400e" opacity="0.3"/>
    <rect x="-82" y="-16" width="52" height="4" rx="2" fill="#92400e" opacity="0.3"/>
    <rect x="-82" y="-4" width="56" height="4" rx="2" fill="#92400e" opacity="0.3"/>
  </g>
</svg>
